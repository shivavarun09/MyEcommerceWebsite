<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
    <!-- password reset -->
    <form id="passwordReset">
      <input
        type="email"
        name=""
        id="resetEmail"
        placeholder="Email"
        required
      />
      <button type="button" id="passResetBtn">Reset Password</button>
      <p id="message"></p>
      <p>Rememberd password <a href="SignInModule.html">click here</a></p>
    </form>
        <!-- Firebase SDK (Modular - v9) -->
        <script type="module">
          // Import the functions 
          
            import {
              auth,
              createUserWithEmailAndPassword,
              signInWithEmailAndPassword,
              sendPasswordResetEmail,
              signOut
            } from './firebase.js';
          
            // Now you can use the auth functions as usual
            // Password reset
document.getElementById("passResetBtn").addEventListener("click", () => {
  const email = document.getElementById("resetEmail").value;
  sendPasswordResetEmail(auth, email)
    .then(() => {
      //alert("Password reset email sent!");
      document.getElementById("message").innerText=`Password reset link sent to your email ${email}!`;
      document.getElementById("resetEmail").value = "";
    })
    .catch((error) => {
      alert("Error: " + error.message);
    });
});
</script>
</body>
</html>
